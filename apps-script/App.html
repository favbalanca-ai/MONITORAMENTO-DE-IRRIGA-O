<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manejo de Irrigação</title>
<style>
  :root {
    --fundo: #f3f5f2;
    --cartao: #ffffff;
    --texto: #1c2420;
    --suave: #5f6b65;
    --linha: #dfe5e0;
    --primaria: #1f6f5c;
    --primaria-texto: #ffffff;
    --irrigar: #1565c0;
    --irrigar-fundo: #e3effc;
    --ok: #2e7d32;
    --ok-fundo: #e5f3e6;
    --semdados: #6d6d6d;
    --semdados-fundo: #ececec;
    --alerta: #9a5b00;
    --alerta-fundo: #fff3dc;
    --erro: #b3261e;
    --chuva: #64b5f6;
    --irrig: #26a69a;
    --deficit: #e65100;
    --afd: #8e24aa;
    --sombra: 0 1px 2px rgba(0,0,0,.06), 0 1px 6px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #111614;
      --cartao: #1a211e;
      --texto: #e6ece8;
      --suave: #9aa8a1;
      --linha: #2b3531;
      --primaria: #4fb39a;
      --primaria-texto: #08130f;
      --irrigar: #7db7ff;
      --irrigar-fundo: #13263d;
      --ok: #7ccf80;
      --ok-fundo: #15291a;
      --semdados: #b0b0b0;
      --semdados-fundo: #262626;
      --alerta: #ffc266;
      --alerta-fundo: #33270f;
      --erro: #ff8a80;
      --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--primaria); color: var(--primaria-texto);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { font-size: 13px; opacity: .85; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
  .tela { display: none; }
  .tela.ativa { display: block; }
  .cartao { background: var(--cartao); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--sombra); border: 1px solid var(--linha); }
  .linha { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .suave { color: var(--suave); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--fundo); border: 1px solid var(--linha); border-radius: 999px; padding: 4px 10px; font-size: 14px; }
  .chip b { font-variant-numeric: tabular-nums; }
  h2 { font-size: 17px; margin: 0; }
  .selo { font-weight: 700; font-size: 13px; letter-spacing: .02em; border-radius: 8px; padding: 4px 8px; white-space: nowrap; }
  .selo.IRRIGAR { background: var(--irrigar-fundo); color: var(--irrigar); }
  .selo.NAO { background: var(--ok-fundo); color: var(--ok); }
  .selo.SEM { background: var(--semdados-fundo); color: var(--semdados); }
  .barra { position: relative; height: 10px; background: var(--fundo); border-radius: 5px; margin: 10px 0 4px; overflow: hidden; border: 1px solid var(--linha); }
  .barra > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--deficit); border-radius: 5px; }
  .barra > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--texto); opacity: .5; }
  .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
  .grade div { background: var(--irrigar-fundo); border-radius: 10px; padding: 8px 10px; }
  .grade small { display: block; color: var(--suave); font-size: 12px; }
  .grade b { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--irrigar); }
  .alertas { list-style: none; padding: 0; margin: 10px 0 0; }
  .alertas li { background: var(--alerta-fundo); color: var(--alerta); border-radius: 8px; padding: 6px 10px; font-size: 14px; margin-top: 6px; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--cartao); border-top: 1px solid var(--linha);
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    background: none; border: 0; color: var(--suave); padding: 8px 0 10px; font: inherit; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 56px;
  }
  nav button .ico { font-size: 22px; line-height: 1; }
  nav button.ativa { color: var(--primaria); font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--suave); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--texto); background: var(--cartao);
    border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; min-height: 44px;
  }
  input:focus, select:focus { outline: 2px solid var(--primaria); outline-offset: 0; }
  .duas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
  .duas > div { min-width: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; min-height: 44px;
    border: 1px solid var(--primaria); background: var(--primaria); color: var(--primaria-texto); cursor: pointer;
  }
  .btn.sec { background: transparent; color: var(--primaria); }
  .btn.peq { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  .btn.cheio { width: 100%; margin-top: 14px; }
  .btn.perigo { border-color: var(--erro); color: var(--erro); background: transparent; }
  header .btn { border-color: var(--primaria-texto); background: transparent; color: var(--primaria-texto); }
  .segmento { display: grid; grid-template-columns: 1fr 1fr; background: var(--fundo); border: 1px solid var(--linha); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .segmento button { border: 0; background: transparent; font: inherit; padding: 8px; border-radius: 9px; color: var(--suave); cursor: pointer; min-height: 40px; }
  .segmento button.ativa { background: var(--cartao); color: var(--texto); font-weight: 600; box-shadow: var(--sombra); }
  .lista { list-style: none; padding: 0; margin: 0; }
  .lista li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--linha); }
  .lista li:first-child { border-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--linha); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--suave); font-weight: 500; }
  .legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--suave); margin-top: 6px; }
  .legenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }
  .legenda span.tr::before { height: 2px; vertical-align: 3px; }
  svg text { fill: var(--suave); font-size: 14px; }
  fieldset { border: 0; padding: 0; margin: 0 0 6px; }
  legend { font-weight: 600; font-size: 15px; margin-top: 12px; }
  #carregando { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 20; }
  #carregando.on { display: flex; }
  #carregando div { background: var(--cartao); color: var(--texto); padding: 14px 18px; border-radius: 12px; box-shadow: var(--sombra); }
  #aviso { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 30; display: none; }
  #aviso div { max-width: 600px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: var(--texto); color: var(--fundo); white-space: pre-line; }
  #aviso.erro div { background: var(--erro); color: #fff; }
  .vazio { text-align: center; color: var(--suave); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>💧 Manejo de Irrigação</h1>
    <div class="sub" id="subtitulo">carregando…</div>
  </div>
  <button class="btn peq" id="btnAtualizar" type="button" aria-label="Recalcular">↻ Recalcular</button>
</header>

<main>
  <!-- HOJE -->
  <section class="tela ativa" id="tela-hoje">
    <div class="cartao" id="clima"></div>
    <div id="cartoesPivos"></div>
  </section>

  <!-- LANÇAR -->
  <section class="tela" id="tela-lancar">
    <div class="segmento" role="tablist">
      <button type="button" class="ativa" data-tipo="irrigacao">🚿 Irrigação</button>
      <button type="button" data-tipo="umidade">🌱 Umidade</button>
    </div>
    <form class="cartao" id="formLancar" autocomplete="off">
      <div class="duas">
        <div><label for="lPivo">Pivô</label><select id="lPivo" required></select></div>
        <div><label for="lData">Data</label><input id="lData" type="date" required></div>
      </div>
      <div id="camposIrrig">
        <label for="lMm">Lâmina líquida aplicada (mm)</label>
        <input id="lMm" inputmode="decimal" placeholder="ex.: 12">
        <label for="lObs">Observação (opcional)</label>
        <input id="lObs" placeholder="ex.: percentímetro 40%">
      </div>
      <div id="camposUmid" hidden>
        <div class="duas">
          <div><label for="lRaiz">Umidade na raiz (%)</label><input id="lRaiz" inputmode="decimal" placeholder="ex.: 27"></div>
          <div><label for="lProf">Camada profunda (%)</label><input id="lProf" inputmode="decimal" placeholder="opcional"></div>
        </div>
        <div class="duas">
          <div><label for="lTensao">Tensão (kPa)</label><input id="lTensao" inputmode="decimal" placeholder="ex.: -45"></div>
          <div><label for="lFonte">Fonte</label><input id="lFonte" placeholder="TDR, tensiômetro…"></div>
        </div>
      </div>
      <button class="btn cheio" type="submit">Lançar</button>
    </form>
    <div class="cartao">
      <div class="linha"><h2>Últimos lançamentos</h2></div>
      <ul class="lista" id="listaLancamentos"></ul>
    </div>
  </section>

  <!-- HISTÓRICO -->
  <section class="tela" id="tela-historico">
    <div class="cartao">
      <div class="duas">
        <div><label for="hPivo">Pivô</label><select id="hPivo"></select></div>
        <div><label for="hDias">Período</label>
          <select id="hDias"><option value="15">15 dias</option><option value="30" selected>30 dias</option><option value="60">60 dias</option><option value="120">120 dias</option></select>
        </div>
      </div>
    </div>
    <div class="cartao">
      <div id="grafico"></div>
      <div class="legenda">
        <span style="--c: var(--deficit)" class="tr">Déficit</span>
        <span style="--c: var(--afd)" class="tr">AFD (limite de estresse)</span>
        <span style="--c: var(--suave)" class="tr">Lâmina mínima</span>
        <span style="--c: var(--chuva)">Chuva</span>
        <span style="--c: var(--irrig)">Irrigação</span>
      </div>
    </div>
    <div class="cartao" id="tabelaHistorico"></div>
  </section>

  <!-- PIVÔS -->
  <section class="tela" id="tela-pivos">
    <div id="listaPivos"></div>
    <button class="btn sec cheio" type="button" id="btnNovoPivo">+ Novo pivô</button>
    <form class="cartao" id="formPivo" hidden autocomplete="off"></form>
  </section>
</main>

<nav>
  <button type="button" class="ativa" data-tela="hoje"><span class="ico">📋</span>Hoje</button>
  <button type="button" data-tela="lancar"><span class="ico">✏️</span>Lançar</button>
  <button type="button" data-tela="historico"><span class="ico">📈</span>Histórico</button>
  <button type="button" data-tela="pivos"><span class="ico">⚙️</span>Pivôs</button>
</nav>

<div id="carregando"><div id="carregandoTexto">Carregando…</div></div>
<div id="aviso" role="status"><div></div></div>

<script>
(function () {
  "use strict";

  /* ---------- utilidades ---------- */
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function (t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  /** Número no formato brasileiro (1.234,5). */
  function br(x, casas) {
    if (x === null || x === undefined || x === "" || isNaN(x)) return "–";
    var p = Math.abs(Number(x)).toFixed(casas).split(".");
    var s = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (p[1] ? "," + p[1] : "");
    return (Number(x) < 0 && Number(Number(x).toFixed(casas)) !== 0 ? "-" : "") + s;
  }
  var dataBr = function (iso) { return iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : ""; };
  function horas(h) {
    var t = Math.round(h * 60);
    return Math.floor(t / 60) + "h" + String(t % 60).padStart(2, "0");
  }

  /** Chama uma função do servidor (google.script.run) como Promise. */
  function api(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, falha) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { falha(e); });
      r[nome].apply(r, args);
    });
  }

  var ocupado = 0;
  function carregando(on, texto) {
    ocupado += on ? 1 : -1;
    if (texto) $("#carregandoTexto").textContent = texto;
    $("#carregando").classList.toggle("on", ocupado > 0);
  }
  var timerAviso;
  function aviso(texto, erro) {
    var a = $("#aviso");
    a.querySelector("div").textContent = texto;
    a.className = erro ? "erro" : "";
    a.style.display = "block";
    clearTimeout(timerAviso);
    timerAviso = setTimeout(function () { a.style.display = "none"; }, erro ? 7000 : 3500);
  }
  var msgErro = function (e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ""); };

  /* ---------- navegação ---------- */
  var telaAtual = "hoje";
  function irPara(tela) {
    telaAtual = tela;
    $$("nav button").forEach(function (b) { b.classList.toggle("ativa", b.dataset.tela === tela); });
    $$(".tela").forEach(function (s) { s.classList.toggle("ativa", s.id === "tela-" + tela); });
    window.scrollTo(0, 0);
    if (tela === "lancar") carregarLancamentos();
    if (tela === "historico") carregarHistorico();
    if (tela === "pivos") carregarPivos();
  }
  $$("nav button").forEach(function (b) { b.addEventListener("click", function () { irPara(b.dataset.tela); }); });

  /* ---------- HOJE ---------- */
  var resumo = null;
  var nomesPivos = [];

  function classeDecisao(d) { return d === "IRRIGAR" ? "IRRIGAR" : d === "SEM DADOS" ? "SEM" : "NAO"; }

  function desenharHoje() {
    if (!resumo) return;
    var c = resumo.clima;
    $("#subtitulo").textContent = "Dia " + dataBr(resumo.dia) + " · calculado " + (resumo.calculadoEm || "").slice(11, 16);
    var ult = resumo.ultimaLeitura;
    $("#clima").innerHTML =
      '<div class="linha"><h2>Estação · janela até ' + esc(dataBr(resumo.dia)) + ' 18h</h2></div>' +
      '<div class="chips" style="margin-top:10px">' +
      '<span class="chip">ET₀ <b>' + br(c.et0, 1) + '</b> mm</span>' +
      '<span class="chip">Chuva <b>' + br(c.chuva, 1) + '</b> mm</span>' +
      '<span class="chip">🌡 <b>' + br(c.tmin, 0) + '–' + br(c.tmax, 0) + '</b> °C</span>' +
      '<span class="chip">UR <b>' + br(c.ur, 0) + '</b>%</span>' +
      '<span class="chip">Leituras <b>' + esc(c.n) + '</b>/144</span>' +
      '</div>' +
      (ult ? '<p class="suave" style="margin:10px 0 0">Última leitura: ' + esc(dataBr(ult.quando.slice(0, 10))) + ' ' + esc(ult.quando.slice(11, 16)) +
        (ult.tempC != null ? ' · ' + br(ult.tempC, 1) + ' °C' : '') + '</p>' : '') +
      (c.estimados && c.estimados.length ? '<ul class="alertas"><li>Estação sem dado de ' + esc(c.estimados.join(", ")) + ' — usado o dia vizinho.</li></ul>' : '');

    var html = resumo.pivos.map(function (p) {
      if (!p.decisao) {
        return '<div class="cartao"><div class="linha"><h2>' + esc(p.nome) + '</h2></div><p class="suave">' + esc(p.aviso || "sem cálculo") + '</p></div>';
      }
      var pct = p.afd > 0 ? Math.min(100, (p.deficit / p.afd) * 100) : 0;
      var marca = p.afd > 0 && p.laminaMinimaMm != null ? Math.min(100, (p.laminaMinimaMm / p.afd) * 100) : null;
      var rec = p.rec && p.decisao === "IRRIGAR"
        ? '<div class="grade">' +
          '<div><small>Percentímetro</small><b>' + br(p.rec.percentimetroPct, 0) + '%</b></div>' +
          '<div><small>Volta</small><b>' + horas(p.rec.tempoVoltaH) + '</b></div>' +
          '<div><small>Lâmina bruta</small><b>' + br(p.rec.laminaBrutaMm, 1) + ' mm</b></div>' +
          '<div><small>Energia</small><b>R$ ' + br(p.rec.custoRs, 0) + '</b><small>' + br(p.rec.energiaKwh, 0) + ' kWh</small></div>' +
          '</div>'
        : p.decisao === "IRRIGAR" ? '<p class="suave">Cadastre o equipamento do pivô para ver percentímetro, tempo e custo.</p>' : '';
      var alertas = (p.alertas || []).filter(function (a) { return a.indexOf("Só ") !== 0 && a.indexOf("Clima estimado") !== 0; });
      return '<div class="cartao">' +
        '<div class="linha"><div><h2>' + esc(p.nome) + '</h2><div class="suave">' + esc(p.cultura) + ' ' + esc(p.estadio) + ' · ' + esc(p.das) + ' DAS · Kc ' + br(p.kc, 2) + '</div></div>' +
        '<span class="selo ' + classeDecisao(p.decisao) + '">' + (p.decisao === "IRRIGAR" ? "🚿 " : "") + esc(p.decisao) + '</span></div>' +
        '<div class="barra" title="Déficit em relação à AFD"><span style="width:' + pct.toFixed(1) + '%"></span>' +
        (marca != null ? '<i style="left:' + marca.toFixed(1) + '%"></i>' : '') + '</div>' +
        '<div class="linha suave"><span>Déficit <b style="color:var(--texto)">' + br(p.deficit, 1) + ' mm</b></span><span>AFD ' + br(p.afd, 1) + ' mm · ETc ' + br(p.etc, 1) + ' mm</span></div>' +
        rec +
        (alertas.length ? '<ul class="alertas">' + alertas.map(function (a) { return '<li>⚠️ ' + esc(a) + '</li>'; }).join("") + '</ul>' : '') +
        (p.diasIncertos ? '<p class="suave" style="margin:8px 0 0">ℹ️ ' + esc(p.diasIncertos) + ' dia(s) do balanço com clima estimado ou incompleto.</p>' : '') +
        '</div>';
    }).join("");
    $("#cartoesPivos").innerHTML = html || '<div class="cartao vazio">Nenhum pivô ativo. Cadastre em ⚙️ Pivôs.</div>';
    nomesPivos = resumo.pivos.map(function (p) { return p.nome; });
    preencherSelects();
  }

  function carregarHoje(recalcular) {
    carregando(true, recalcular ? "Recalculando…" : "Carregando…");
    return api("apiHoje", !!recalcular).then(function (r) {
      resumo = r;
      desenharHoje();
      if (recalcular) aviso("Recalculado.");
    }).catch(function (e) {
      $("#subtitulo").textContent = "sem cálculo";
      $("#cartoesPivos").innerHTML = '<div class="cartao vazio">' + esc(msgErro(e)) + '</div>';
      aviso(msgErro(e), true);
    }).then(function () { carregando(false); });
  }
  $("#btnAtualizar").addEventListener("click", function () { carregarHoje(true); });

  function preencherSelects() {
    ["#lPivo", "#hPivo"].forEach(function (s) {
      var el = $(s), atual = el.value;
      el.innerHTML = nomesPivos.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join("");
      if (nomesPivos.indexOf(atual) >= 0) el.value = atual;
    });
  }

  /* ---------- LANÇAR ---------- */
  var tipoLanc = "irrigacao";
  $$(".segmento button").forEach(function (b) {
    b.addEventListener("click", function () {
      tipoLanc = b.dataset.tipo;
      $$(".segmento button").forEach(function (x) { x.classList.toggle("ativa", x === b); });
      $("#camposIrrig").hidden = tipoLanc !== "irrigacao";
      $("#camposUmid").hidden = tipoLanc !== "umidade";
    });
  });

  function hojeIso() {
    if (resumo && resumo.hoje) return resumo.hoje;
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  $("#formLancar").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var d = { pivo: $("#lPivo").value, data: $("#lData").value };
    if (tipoLanc === "irrigacao") {
      d.mm = $("#lMm").value; d.obs = $("#lObs").value;
      if (!d.mm) return aviso("Informe a lâmina aplicada.", true);
    } else {
      d.umidadeRaiz = $("#lRaiz").value; d.umidadeProfunda = $("#lProf").value; d.tensao = $("#lTensao").value; d.fonte = $("#lFonte").value;
      if (!d.umidadeRaiz) return aviso("Informe a umidade na raiz.", true);
    }
    carregando(true, "Lançando e recalculando…");
    api("apiLancar", tipoLanc, d).then(function (r) {
      if (r.resumo) { r.resumo.hoje = resumo && resumo.hoje; r.resumo.ultimaLeitura = resumo && resumo.ultimaLeitura; resumo = r.resumo; desenharHoje(); }
      ["#lMm", "#lObs", "#lRaiz", "#lProf", "#lTensao"].forEach(function (s) { $(s).value = ""; });
      aviso(r.aviso || "✅ Lançado. Decisão recalculada.", !!r.aviso);
      return carregarLancamentos();
    }).catch(function (e) { aviso(msgErro(e), true); }).then(function () { carregando(false); });
  });

  function carregarLancamentos() {
    if (!$("#lData").value) $("#lData").value = hojeIso();
    $("#lData").max = hojeIso();
    return api("apiLancamentos", 20).then(function (ls) {
      $("#listaLancamentos").innerHTML = ls.length ? ls.map(function (l, i) {
        var txt = l.tipo === "irrigacao"
          ? "🚿 " + br(l.valores[0], 1) + " mm" + (l.valores[1] ? " · " + esc(l.valores[1]) : "")
          : "🌱 " + br(l.valores[0], 1) + "%" + (l.valores[1] !== "" ? " · prof. " + br(l.valores[1], 1) + "%" : "") + (l.valores[2] !== "" ? " · " + br(l.valores[2], 0) + " kPa" : "");
        return '<li><div><b>' + esc(dataBr(l.data)) + '</b> · ' + esc(l.pivo) + '<div class="suave">' + txt + '</div></div>' +
          '<button class="btn perigo peq" type="button" data-i="' + i + '" aria-label="Apagar">Apagar</button></li>';
      }).join("") : '<li class="vazio">Nada lançado ainda.</li>';
      $$("#listaLancamentos button").forEach(function (b) {
        b.addEventListener("click", function () {
          var l = ls[Number(b.dataset.i)];
          if (!confirm("Apagar " + (l.tipo === "irrigacao" ? "a irrigação" : "a medição") + " de " + dataBr(l.data) + " no " + l.pivo + "?")) return;
          carregando(true, "Apagando…");
          api("apiApagarLancamento", l.tipo, l.linha, l.data, l.pivo)
            .then(function () { aviso("Apagado."); return Promise.all([carregarLancamentos(), carregarHoje(false)]); })
            .catch(function (e) { aviso(msgErro(e), true); })
            .then(function () { carregando(false); });
        });
      });
    }).catch(function (e) { aviso(msgErro(e), true); });
  }

  /* ---------- HISTÓRICO ---------- */
  function grafico(h) {
    var ls = h.linhas;
    if (!ls.length) return '<div class="vazio">Sem dados para este pivô.</div>';
    var W = 640, H = 280, mE = 38, mD = 8, mT = 10, mB = 26;
    var w = W - mE - mD, alt = H - mT - mB;
    var maxV = 5;
    ls.forEach(function (l) { maxV = Math.max(maxV, l.deficit || 0, l.afd || 0, l.chuva || 0, l.irrigacao || 0); });
    maxV = Math.ceil(maxV / 10) * 10;
    var x = function (i) { return mE + (ls.length === 1 ? w / 2 : (i * w) / (ls.length - 1)); };
    var y = function (v) { return mT + alt - (Math.min(v, maxV) / maxV) * alt; };
    var bw = Math.max(2, Math.min(14, (w / ls.length) * 0.35));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Gráfico do balanço hídrico">';
    for (var g = 0; g <= 4; g++) {
      var v = (maxV * g) / 4, yy = y(v);
      s += '<line x1="' + mE + '" x2="' + (W - mD) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--linha)"/>';
      s += '<text x="' + (mE - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + br(v, 0) + '</text>';
    }
    ls.forEach(function (l, i) {
      if (l.chuva > 0) s += '<rect x="' + (x(i) - bw) + '" y="' + y(l.chuva) + '" width="' + bw + '" height="' + (mT + alt - y(l.chuva)) + '" fill="var(--chuva)" rx="1"><title>' + dataBr(l.data) + ': chuva ' + br(l.chuva, 1) + ' mm</title></rect>';
      if (l.irrigacao > 0) s += '<rect x="' + x(i) + '" y="' + y(l.irrigacao) + '" width="' + bw + '" height="' + (mT + alt - y(l.irrigacao)) + '" fill="var(--irrig)" rx="1"><title>' + dataBr(l.data) + ': irrigação ' + br(l.irrigacao, 1) + ' mm</title></rect>';
    });
    var linha = function (campo) {
      return ls.map(function (l, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(l[campo] || 0).toFixed(1); }).join(" ");
    };
    s += '<path d="' + linha("afd") + '" fill="none" stroke="var(--afd)" stroke-width="2" stroke-dasharray="6 4"/>';
    if (h.laminaMinimaMm != null) s += '<line x1="' + mE + '" x2="' + (W - mD) + '" y1="' + y(h.laminaMinimaMm) + '" y2="' + y(h.laminaMinimaMm) + '" stroke="var(--suave)" stroke-dasharray="2 4"/>';
    s += '<path d="' + linha("deficit") + '" fill="none" stroke="var(--deficit)" stroke-width="2.5" stroke-linejoin="round"/>';
    ls.forEach(function (l, i) {
      s += '<circle cx="' + x(i) + '" cy="' + y(l.deficit || 0) + '" r="' + (l.medicao ? 4.5 : 2.5) + '" fill="' + (l.medicao ? "var(--cartao)" : "var(--deficit)") + '" stroke="var(--deficit)" stroke-width="2"><title>' + dataBr(l.data) + ': déficit ' + br(l.deficit, 1) + ' mm · ' + l.decisao + (l.medicao ? " · medição de umidade" : "") + '</title></circle>';
    });
    var passo = Math.max(1, Math.ceil(ls.length / 8));
    ls.forEach(function (l, i) {
      var ultima = i === ls.length - 1;
      if ((i % passo === 0 && (ls.length - 1 - i >= passo / 2 || ultima)) || ultima) s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? "start" : ultima ? "end" : "middle") + '">' + dataBr(l.data) + '</text>';
    });
    return s + '</svg>';
  }

  function carregarHistorico() {
    var nome = $("#hPivo").value || nomesPivos[0];
    if (!nome) { $("#grafico").innerHTML = '<div class="vazio">Nenhum pivô.</div>'; return; }
    carregando(true, "Carregando histórico…");
    api("apiHistorico", nome, Number($("#hDias").value)).then(function (h) {
      $("#grafico").innerHTML = grafico(h);
      var ls = h.linhas.slice().reverse();
      $("#tabelaHistorico").innerHTML = ls.length
        ? '<table><thead><tr><th>Dia</th><th>Déficit</th><th>ETc</th><th>Chuva</th><th>Irrig.</th><th>Decisão</th></tr></thead><tbody>' +
          ls.map(function (l) {
            return '<tr><td>' + dataBr(l.data) + (l.medicao ? ' 🌱' : '') + '</td><td>' + br(l.deficit, 1) + '</td><td>' + br(l.etc, 1) + '</td><td>' + br(l.chuva, 1) +
              '</td><td>' + br(l.irrigacao, 1) + '</td><td><span class="selo ' + classeDecisao(l.decisao) + '">' + esc(l.decisao === "NÃO IRRIGAR" ? "NÃO" : l.decisao === "SEM DADOS" ? "S/ DADOS" : l.decisao) + '</span></td></tr>';
          }).join("") + '</tbody></table>'
        : '';
    }).catch(function (e) { aviso(msgErro(e), true); }).then(function () { carregando(false); });
  }
  $("#hPivo").addEventListener("change", carregarHistorico);
  $("#hDias").addEventListener("change", carregarHistorico);

  /* ---------- PIVÔS ---------- */
  var cadastro = null;
  var GRUPOS = [
    ["Identificação", ["nome", "ativo", "cultura", "plantio", "inicioBalanco", "palhada"]],
    ["Solo e raiz", ["umidadeInicialPct", "cc", "pmp", "raizIniCm", "raizMaxCm", "diasRaiz", "fatorFixo"]],
    ["Decisão", ["laminaMinimaMm", "tensaoIrrigarKpa"]],
    ["Equipamento", ["raioM", "anguloGraus", "vazaoM3h", "velocidadeUltimaTorreMMin", "percentimetroMinPct", "eficienciaPct", "potenciaKw", "tarifaRsKwh"]],
  ];
  var simNao = function (v) { return v === true || /^(SIM|S|TRUE|1|X)$/i.test(String(v).trim()); };

  function desenharPivos() {
    var ps = cadastro.pivos;
    $("#listaPivos").innerHTML = ps.length ? ps.map(function (p, i) {
      return '<div class="cartao"><div class="linha"><div><h2>' + esc(p.nome) + (simNao(p.ativo) ? '' : ' <span class="suave">(inativo)</span>') + '</h2>' +
        '<div class="suave">' + esc(p.cultura) + ' · plantio ' + esc(dataBr(String(p.plantio))) + '/' + esc(String(p.plantio).slice(0, 4)) +
        (p.raioM ? ' · raio ' + br(p.raioM, 0) + ' m' : ' · sem equipamento') + '</div></div>' +
        '<button class="btn sec peq" type="button" data-i="' + i + '">Editar</button></div></div>';
    }).join("") : '<div class="cartao vazio">Nenhum pivô cadastrado.</div>';
    $$("#listaPivos button").forEach(function (b) { b.addEventListener("click", function () { abrirForm(cadastro.pivos[Number(b.dataset.i)]); }); });
  }

  function campo(chave, rotulo, valor) {
    var id = "p_" + chave;
    if (chave === "ativo" || chave === "palhada") {
      return '<div><label for="' + id + '">' + esc(rotulo.replace(" (SIM/NÃO)", "")) + '</label><select id="' + id + '" name="' + chave + '">' +
        '<option value="SIM"' + (simNao(valor) ? " selected" : "") + '>Sim</option><option value="NÃO"' + (simNao(valor) ? "" : " selected") + '>Não</option></select></div>';
    }
    if (chave === "cultura") {
      return '<div><label for="' + id + '">' + esc(rotulo) + '</label><select id="' + id + '" name="' + chave + '">' +
        cadastro.culturas.map(function (c) { return '<option' + (String(valor).toLowerCase() === c ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("") + '</select></div>';
    }
    if (chave === "plantio" || chave === "inicioBalanco") {
      return '<div><label for="' + id + '">' + esc(rotulo) + '</label><input type="date" id="' + id + '" name="' + chave + '" value="' + esc(valor) + '"></div>';
    }
    if (chave === "nome") {
      return '<div><label for="' + id + '">' + esc(rotulo) + '</label><input id="' + id + '" name="' + chave + '" value="' + esc(valor) + '" required></div>';
    }
    var v = valor === "" || valor == null ? "" : String(valor).replace(".", ",");
    return '<div><label for="' + id + '">' + esc(rotulo) + '</label><input inputmode="decimal" id="' + id + '" name="' + chave + '" value="' + esc(v) + '"></div>';
  }

  var nomeEditando = null;
  function abrirForm(p) {
    nomeEditando = p ? p.nome : null;
    var rot = {};
    cadastro.colunas.forEach(function (c) { rot[c[0]] = c[1]; });
    var base = p || { ativo: "SIM", cultura: cadastro.culturas[0], palhada: "SIM", fatorFixo: "", tensaoIrrigarKpa: -70, laminaMinimaMm: 5, anguloGraus: 360, eficienciaPct: 85, percentimetroMinPct: 10 };
    var f = $("#formPivo");
    f.innerHTML = '<div class="linha"><h2>' + (p ? "Editar " + esc(p.nome) : "Novo pivô") + '</h2><button type="button" class="btn sec peq" id="btnFecharPivo">Fechar</button></div>' +
      GRUPOS.map(function (g) {
        return '<fieldset><legend>' + esc(g[0]) + '</legend><div class="duas">' +
          g[1].map(function (k) { return campo(k, rot[k] || k, base[k] == null ? "" : base[k]); }).join("") + '</div></fieldset>';
      }).join("") +
      '<p class="suave">Valores de solo, Kc e equipamento precisam ser confirmados com o agrônomo e a placa do pivô.</p>' +
      '<button class="btn cheio" type="submit">Salvar</button>';
    f.hidden = false;
    $("#listaPivos").hidden = true;
    $("#btnNovoPivo").hidden = true;
    $("#btnFecharPivo").addEventListener("click", fecharForm);
    f.scrollIntoView();
  }
  function fecharForm() {
    $("#formPivo").hidden = true;
    $("#listaPivos").hidden = false;
    $("#btnNovoPivo").hidden = false;
  }
  $("#btnNovoPivo").addEventListener("click", function () { abrirForm(null); });

  $("#formPivo").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var dados = {};
    $$("#formPivo [name]").forEach(function (el) { dados[el.name] = el.value; });
    carregando(true, "Salvando…");
    api("apiSalvarPivo", dados, nomeEditando).then(function (c) {
      cadastro = c;
      fecharForm();
      desenharPivos();
      aviso("✅ Pivô salvo. Recalculando…");
      return carregarHoje(true);
    }).catch(function (e) { aviso(msgErro(e), true); }).then(function () { carregando(false); });
  });

  function carregarPivos() {
    carregando(true, "Carregando pivôs…");
    return api("apiPivos").then(function (c) { cadastro = c; desenharPivos(); })
      .catch(function (e) { aviso(msgErro(e), true); })
      .then(function () { carregando(false); });
  }

  /* ---------- início ---------- */
  carregarHoje(false);
})();
</script>
</body>
</html>
